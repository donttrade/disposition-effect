<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engine harness</title>
<!-- Test-only page: loads the browser engine so Playwright can feed it fixture bytes.
     Not part of the site build. -->
</head>
<body>
<p id="status">loading</p>
<script type="module">
import { runFile } from '/site/static/js/engine/index.js';
import { freeStats } from '/site/static/js/engine/stats.js';
import { noiseChecks, checkExpectancy, SEED_BASE } from '/site/static/js/engine/noise.js';
import { pgrPlrCounts } from '/site/static/js/engine/pgr.js';
import { stripRows } from '/site/static/js/paid/strip.js';
function bytesOf(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
// Same shape as engine_ref.run_fixture(): {result, stats, noise} or {error}.
window.runEngine = (b64) => {
  const r = runFile(bytesOf(b64));
  if (r.error) return JSON.stringify(r);
  return JSON.stringify({ result: r.result, stats: freeStats(r.result.trades), noise: noiseChecks(r.result.trades),
    pgr_plr: pgrPlrCounts(r.result.executions) });
};
// The free expectancy check alone on P&L vectors (amendment §4 guard vectors).
window.expectancyChecks = (json) => JSON.stringify(JSON.parse(json).map((x) => checkExpectancy(x, SEED_BASE)));
// Parse only (no stats or noise checks): the fuzz parity tests run hundreds of files.
window.parseOnly = (b64) => JSON.stringify(runFile(bytesOf(b64)));
window.runNoiseInWorker = (b64) => new Promise((resolve) => {
  const r = runFile(bytesOf(b64));
  const w = new Worker('/site/static/js/engine/noise-worker.js', { type: 'module' });
  w.onmessage = (ev) => { w.terminate(); resolve(JSON.stringify(ev.data.noise)); };
  w.postMessage({ trades: r.result.trades.map((t) => ({ pnl: t.pnl, hold_s: t.hold_s })) });
});
window.stripFixture = async (b64, salt) => {
  const r = runFile(bytesOf(b64));
  if (r.error) return 'null';
  return JSON.stringify(await stripRows(r.result.trades, salt, (n) => Array.from({ length: n }, (_, i) => i)));
};
window.statsWithBalance = (b64, bal) => JSON.stringify(freeStats(runFile(bytesOf(b64)).result.trades, bal));
window.runEngineTimed = (b64) => {
  const bytes = bytesOf(b64);
  const t0 = performance.now();
  const r = runFile(bytes);
  const ms = performance.now() - t0;
  return JSON.stringify({ ms, error: r.error || null, trades: r.result ? r.result.trades.length : 0 });
};
document.getElementById('status').textContent = 'ready';
</script>
</body>
</html>
