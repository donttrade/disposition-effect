# site.toml — the one settings file for the v2 build (committed).
# Secrets never go here. The seller's legal name, address and phone live only in
# the gitignored private.toml, read only while a commerce flag (paid_report or
# pilot_checkout) is on. Any commerce flag puts the business line (donttrade · Ontario,
# Canada · mailing address · contact_email) in every footer; the legal name and phone
# appear only where the seller block shows ([legal] show_seller_for_pilot below).

[site]
name = "donttrade"
base_url = "https://donttrade.ca"
contact_email = "donttrade.research@gmail.com"
reply_promise = "We reply within 1 business day (Eastern Time, Monday to Friday)."
# Manual restore (owner decision 21 Oct ~11:00, Manager review): a buyer whose access link stops working
# emails us from the address they paid with, and the owner sends a new link by hand, ONLY to the address
# on the Stripe payment. true: /welcome/, /restore/ and the terms say so. false: "restore by email is not offered".
manual_restore = true

[flags]
paid_report = true        # the $39 report, its pages and the trader Stripe links
analytics = true          # Cloudflare Web Analytics beacon
trader_first_home = true  # must equal paid_report (the build fails otherwise)
pilot_checkout = false     # "Start a Pilot" block + thanks page with the live Stripe Pilot link
# R-D2 (23 Oct): the hold-gap check is excluded from any free_badges switch-on until Option B passes
# (ARCHITECT-STATS-AMENDMENT-R2 §10 item 8; the free hold-gap badge is the paid hold_gap method, R2-8).
free_badges = false        # free tools' "real or noise" badges + footnote (off: free-launch condition C1, being redesigned)
ask_box = false            # hidden until the answer engine passes a real-question test
journal = false            # the free Trading Journal + P&L Calendar (/journal/, /tools/pnl-calendar/ and their nav row): off until the Tester passes J1-J38 and the owner approves

[analytics]
cf_beacon_token = "cdac673936b54f08beb5991aaae13975"       # required when analytics = true

[stripe]
mode = "live"              # which prices.json link the paid build renders: "test" or "live"

[forms]
endpoint = "https://api.web3forms.com/submit"
firm_key = "f8fdba04-71bb-4856-b700-01ac6796c252"     # Web3Forms access keys are public by design
trader_key = "54d01baf-5e02-4d93-988c-16cf5487732d"
redirect_firm = "https://donttrade.ca/start/thanks/"
redirect_trader = "https://donttrade.ca/for-traders/thanks/"
redirect_pilot = "https://donttrade.ca/start/pilot-thanks/"   # used only with pilot_checkout = true

[worker]
api_base = "https://donttrade-api.donttrade-research.workers.dev"  # local dev server only; no production value yet

[legal]
# Show the seller's legal name, address and phone with pilot_checkout alone? The plan DoD says
# no seller name while paid_report is off, so: false until the owner decides (Tester D2).
# paid_report always shows them (consumer sale, O. Reg. 17/05 s. 32).
show_seller_for_pilot = false
# The push day, YYYY-MM-DD (Manager C3). ONE setting for every launch-dated statement: the terms and
# privacy version (/terms/, /privacy/, the French pages), "Pilot (called 'Trial' before <date>)" and
# the price-history row of the launch changes. Empty = the build date, for builds before launch.
# Set it on push day and keep it: a date after the build date fails the build, and
# ./site/run.sh bundle refuses an empty one. Change it again with any later legal edit.
launch_date = "2026-10-29"
# The version of the terms (/terms/, /fr/conditions/) and, with cloudflare_pages_since, of the privacy notice,
# YYYY-MM-DD (29 Oct, one product). Set it to the day of any later legal edit; launch_date stays as it is, so
# "called 'Trial' before <launch_date>" never moves. On or after launch_date, not after the build date;
# empty = the build date, and ./site/run.sh bundle refuses an empty one.
terms_date = "2026-10-29"
# T0: the day the site moved from GitHub Pages to Cloudflare Pages (the zone became Active, runbook
# step 83), YYYY-MM-DD. Stated on /privacy/ and /fr/confidentialite/. Required: empty or a date after
# the build date fails the build. The privacy notice's version is the later of this and launch_date.
cloudflare_pages_since = "2026-10-24"
# Verbatim from NON-ADVISER-DESIGN-AND-AUTORENEW A3 (the only approved wording).
disclaimer_short = "donttrade measures your own past trades. It is not investment advice, does not recommend any security, trade, size or exit, and is not registered as an adviser. Past results do not predict future results."
disclaimer_long = "donttrade measures your own past trades. It is not investment advice, does not recommend any security, trade, size or exit, and is not registered as an adviser. Past results do not predict future results."

# Nav (ARCHITECT-V3 §c.2, owner decision Q1 21 Oct ~18:30; QA 25 Oct adds For traders): Free tools ·
# Research · For firms · For traders · Pricing · About. A [[nav]] entry with [[nav.items]] is a drop-down (<details name="nav">, works without JS);
# one without is a plain link. Each item: label, href, desc (one plain line: the build refuses a digit,
# "$", "%" or a banned.toml word in any nav text), icon (partials/icons.html) and optional
# requires_flag. [[nav.foot]] = text links under the panel's rule; label_if_paid replaces label
# with paid_report on. The nav never shows a price, a % or a study number (D3).
# 25 Oct sweep (owner): four items. Research, About and For traders are in the footer.
# 29 Oct (owner): four plain links, no drop-down; /tools/ shows every tool with a preview.
[[nav]]
label = "Example report"
href = "/sample-report/"

[[nav]]
label = "Free tools"
href = "/tools/"

[[nav]]
label = "Pricing"
href = "/pricing/"

[[nav]]
label = "For firms"
href = "/for-firms/"

