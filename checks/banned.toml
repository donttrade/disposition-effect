# banned.toml — wording rules for checks/lint.py.
# Source: NON-ADVISER-DESIGN-AND-AUTORENEW A3 (the "Don't use" column) plus the
# teardown's AI-tell list. Matching is case-insensitive on whole words/phrases.
# A hit is allowed only inside an allowlisted phrase (the disclaimer and listed negations).

[words]
advice = ["advice", "advise", "advises", "advising", "adviser", "advisers", "advisor", "advisors"]
recommend = ["recommend", "recommends", "recommended", "recommendation", "recommendations", "suggested", "best for you"]
directive = ["should", "must", "need to", "needs to", "fix", "fixes", "stop doing"]
coaching = ["coach", "coaching", "mentor", "mentoring", "signals", "alerts to trade"]
promises = ["improve your returns", "become profitable", "win more", "edge guaranteed", "real edge", "proven strategy", "guaranteed"]
cause = ["you lost $", "because of your"]
# Orchestrator rule (21 Oct): never call donttrade's work, or a firm's figure, any of these.
assurance = ["certified", "verified", "audited", "certification", "certify", "verification", "audit", "audits"]
# Trial was renamed Pilot on 22 Oct 2026 (plan step 14); only the "formerly" line may name it.
renamed = ["trial"]
# Competition Act regular-price risk (DECISIONS ADDED 20 Oct): no "standard price after launch".
# The old product name used as a call to action; checked on passthrough pages too, where
# "trial" also means a statistical trial (the research ledgers), so only these forms are banned.
trial_cta = ["start a trial", "firms: trial", "request a trial", "book a trial", "free trial"]
regular_price = ["standard price", "standard prices", "regular price", "after launch:"]
ai_tells = ["unlock", "unlocks", "unlocked", "elevate", "supercharge", "#1", "trusted by"]

[allow]
# Phrases in which a banned word is fine (negations and the required disclaimer).
phrases = [
  "donttrade measures your own past trades. It is not investment advice, does not recommend any security, trade, size or exit, and is not registered as an adviser. Past results do not predict future results.",
  "not investment advice",
  "nothing here is investment advice",
  "is not advice",
  "not advice",
  "no advice",
  "not registered as an adviser",
  "does not recommend",
  "never recommends",
  "no signals",
  "no legal advice",
  "not legal advice",
  "legal advisers",
  # negations of the assurance words, word for word as they appear on the pages
  "never audited, certified or verified",
  "describe it as audited, certified or verified",
  "call any leader or ranking audited, certified or verified",
  "call the claim or the product certified, verified or audited",
  "It is not an audit",
  "Not an audit and not an assurance engagement",
  "Isn’t this a kind of audit?",
  # the one place the old product name may appear
  "called “Trial” before 22 Oct 2026",
  # FAQ questions whose answer on the page starts with "No."
  "Is this investment advice?",
  "Is this advice?",
]

[words_fr]
# FRENCH-LEGAL-AND-CHECKOUT-DRAFTS §8.3, mirroring NON-ADVISER A3. A trailing * matches any ending.
# conseil/conseils/conseiller/recommand* are allowed only inside data-lint="disclaimer" blocks,
# which lint.py removes before this list is applied.
banned = ["conseil*", "recommand*", "devriez", "devez", "il faut", "corriger", "coach*", "mentor*", "signal", "signaux",
          "alerte de trade", "meilleur pour vous", "améliorer vos rendements", "devenir rentable", "garanti*",
          "anonyme*", "rien ne quitte", "un clic", "certifié*", "vérifié*", "audité*"]

[claims]
# Phrases that become false once a paid flow exists (CONCERN 6).
no_upload = ["nothing leaves", "nothing is uploaded", "never leaves your browser"]
no_analytics = ["no analytics", "runs no analytics"]
# Restore-by-email is not in v1 (DECISIONS ADDED 20 Oct): only the restore link/file exists.
# Regexes (case-insensitive), checked on page text and on the paid scripts' strings.
restore_email = ['restore[\s-]+(?:access[\s-]+|your[\s-]+\w+[\s-]+)?(?:by|via|through|over)[\s-]+e-?mail',
                 'restore\b[^.<]{0,60}\baddress you paid with',
                 'e-?mail(?:ed)?[^.<]{0,30}\brestore[\s-]+link',
                 'restore[^.<]{0,40}\b(?:enter|type)[^.<]{0,20}\be-?mail',
                 # NIT 1 rewordings: "get your access back by email", "recover … via e-mail",
                 # "restore using your email address", "restore it by emailing us", "we can email you a new link"
                 '(?:restore|recover|regain|re-?open|get[\s-]+(?:your[\s-]+)?(?:access|it|key|report|purchase)[\s-]+back)\b[^.<]{0,40}?\b(?:by|via|through|over|using|with)[\s-]+(?:your[\s-]+|an[\s-]+|a[\s-]+)?e-?mail',
                 'e-?mail(?:s|ed)?[\s-]+you[\s-]+(?:a[\s-]+)?(?:new|fresh|restore|access|another|recovery)[\s-]+(?:link|key|code)']
restore_email_allow = ["restore by email is not offered", "Restore-by-email is not in v1"]
# R5: false once the habit report is sold. Checked on every page of a paid_report build (EN and
# FR, visible text, meta/og descriptions, JSON-LD, alt/title/aria-label). The allow list holds
# the historical price-history row and a quoted competitor page.
not_on_sale = ["not on sale", "waitlist", "wait list", "wait-list", "nothing is charged now", "no launch date",
               "coming soon", "launch date", "liste d’attente", "liste d'attente", "pas en vente", "pas encore en vente",
               "bientôt disponible"]
# Decision 21 Oct (Visa Core Rules 5.4.2.5: "A Merchant must not require a Cardholder to waive
# the right to dispute a Transaction"): a waive-word within waive_dispute_window characters of a
# dispute-word, in either order, fails on every page (EN and FR) and in every script's strings.
# Regexes, case-insensitive, whole words.
waive_dispute_waive = ['waiv\w*', 'forgo\w*', 'give up', 'gives up', 'agrees? not to', 'renon\w*']
waive_dispute_target = ['disput\w*', 'charge[\s-]?backs?', 'chargebacks?', 'contest\w*', 'rétrofactur\w*', 'litiges?']
waive_dispute_window = 80
not_on_sale_allow = ["Founding price for the first 100 on the trader waitlist added.",
                     "its own research page reads “Coming Soon.”"]

[secrets]
patterns = ['sk_live_[0-9A-Za-z]{8,}', 'sk_test_[0-9A-Za-z]{8,}', 'rk_live_[0-9A-Za-z]{8,}', 'rk_test_[0-9A-Za-z]{8,}', 'whsec_[0-9A-Za-z]{8,}', '-----BEGIN [A-Z ]*PRIVATE KEY-----']
