# strings.toml — sentences used on more than one page, kept in ONE place (delivery plan C-11).
# Templates read them as {{ strings.<table>.<key> }}. checks: site/build.py storage_claim_problems()
# fails the build if any element says a thing is "not stored"/"not kept"/"never stored"/"ne sont pas
# conservés" without also naming the fingerprint ("fingerprint"/"empreinte") in the same element.

[p5]
# What the browser sends for the paid report, and what the server keeps (P-5; /privacy/ discloses the
# keyed-hash fingerprints and their deletion dates).
long = "Your browser sends our server only stripped trade numbers: open and close times, buy or sell, relative size, the realised result and a random symbol number. No name, account number or ticker is sent. The numbers are not kept; we keep only a scrambled fingerprint of each trade row from your first report, so a re-test can be matched to the same history, and we delete it on the dates in our privacy notice."
# Short form (home page list item).
short = "It sends our server only stripped trade numbers. Those are not kept; only a scrambled fingerprint of each trade is kept, for the re-test."
